[project]
name = "sqler"
version = "1.2026.3.5"
description = "A lightweight, JSON-first micro-ORM for SQLite — Pydantic models as JSON documents, fluent queries, sync + async"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["sqlite", "orm", "json", "pydantic", "database", "micro-orm", "document-store"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# Core deps only - pydantic is optional for Pyodide compatibility
dependencies = [
    "aiosqlite>=0.21.0",
]

[project.optional-dependencies]
# Lite mode: no extra deps (Pyodide compatible) - default behavior now
lite = []
# Pydantic models: full Pydantic features
pydantic = ["pydantic>=2.7.0"]
# msgspec models: C-level JSON decode+validate
msgspec = [
    "msgspec>=0.19.0",
]
# Full features: all optional dependencies
full = ["pydantic>=2.7.0"]
# Default install for backwards compat: pip install sqler[default]
default = ["pydantic>=2.7.0"]

[project.urls]
Homepage = "https://github.com/gabu-quest/sqler"
Documentation = "https://gabu-quest.github.io/sqler/"
Repository = "https://github.com/gabu-quest/sqler"
Changelog = "https://github.com/gabu-quest/sqler/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/gabu-quest/sqler/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff==0.12.10",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=5.1.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "asgi-lifespan>=2.1.0",
    "python-multipart>=0.0.9",
    "Jinja2>=3.1",
    "marimo>=0.20",
    "pre-commit>=4.5.1",
]

benchmarks = [
    "matplotlib>=3.9.0",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["sqler", "examples"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "N",  # pep8-naming
]
ignore = [
  "E501",  # long lines allowed in docstrings/examples
  "E711",  # comparison to None - intentional for query DSL (F("field") == None -> IS NULL)
  "E712",  # comparison to True/False - intentional for query DSL (F("field") == True)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["N", "E501", "F841"]  # unused vars ok in tests
"examples/**/*" = ["N", "E501", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
