name: Deploy Tour Notebooks

on:
  push:
    branches: [main]
    paths:
      - 'examples/tour_*.py'
      - 'examples/ja/tour_*.py'
      - 'examples/lite/tour_*_lite.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Export notebooks to WASM (fully interactive)
        run: |
          mkdir -p _site
          mkdir -p _site/ja
          mkdir -p _site/lite

          # Export each English tour notebook as WASM for full interactivity
          for notebook in examples/tour_*.py; do
            name=$(basename "$notebook" .py)
            echo "Exporting $name as WASM..."
            uv run marimo export html-wasm "$notebook" -o "_site/${name}"
          done

          # Export each Japanese tour notebook as WASM
          for notebook in examples/ja/tour_*.py; do
            name=$(basename "$notebook" .py)
            echo "Exporting ja/$name as WASM..."
            uv run marimo export html-wasm "$notebook" -o "_site/ja/${name}"
          done

          # Export lite tours (dataclass-based, WASM-compatible)
          for notebook in examples/lite/tour_*_lite.py; do
            name=$(basename "$notebook" .py)
            echo "Exporting lite/$name as WASM..."
            uv run marimo export html-wasm "$notebook" -o "_site/lite/${name}"
          done

          # Create English index page
          cat > _site/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>SQLer Tour</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
              h1 { color: #333; }
              .lang-switch { text-align: right; margin-bottom: 1rem; }
              .lang-switch a { color: #666; text-decoration: none; }
              .lang-switch a:hover { text-decoration: underline; }
              .tour-list { list-style: none; padding: 0; }
              .tour-list li { margin: 1rem 0; }
              .tour-list a {
                display: block; padding: 1rem; background: #f5f5f5;
                border-radius: 8px; text-decoration: none; color: #333;
                transition: background 0.2s;
              }
              .tour-list a:hover { background: #e8e8e8; }
              .tour-list .title { font-weight: bold; font-size: 1.1rem; }
              .tour-list .desc { color: #666; font-size: 0.9rem; margin-top: 0.25rem; }
            </style>
